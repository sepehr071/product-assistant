[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "product-kiosk-agent"
version = "0.1.0"
description = "Store kiosk voice agent: scan a barcode, talk about the product"
requires-python = ">=3.12"
dependencies = [
    "livekit-agents[openai,silero]~=1.8",
    "livekit-plugins-ai-coustics~=0.2",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[tool.setuptools]
py-modules = ["agent", "catalog", "product"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
